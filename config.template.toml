[sip]
account = ""
password = ""
domain = ""
proxy = ""
port = 5060
event_timeout = 20 # milliseconds
log_level = 3 # 0 to 6
console_log_level = 3 # 0 to 6
include_sip_log_messages = false

[call]
data_directory = "" # leave empty if the server was installed
data_retention = 30 # days
greeting_tone_gap = 0.5 # seconds
media_timeout = 30 # seconds
voicemail_duration_max = 180 # seconds
voicemail_duration_min = 0.5 # seconds
voicemail_silence_threshold = -40 # dBFS (0 disables the silence threshold)

[mail]
command = ["mail"]
sender = "Voicemail Server <voicemail@example.com>"
language = "english"
phone_number_region_code = "US"
time_zone = "UTC"
timeout = 30 # seconds

[[mail.recipients]]
address = "Alex <alex@example.com>"
preferred_name = "Al"

[log]
level = "INFO" # DEBUG|INFO|WARNING|ERROR|CRITICAL
